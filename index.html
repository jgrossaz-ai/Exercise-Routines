<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f5f5f7'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.svg'><title>Exercise Routines</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:rgba(245,245,247,.94);backdrop-filter:blur(12px);padding:18px 16px 12px;border-bottom:1px solid #ddd;z-index:2}h1{font-size:28px;margin:0 0 12px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.tabs button,.primary,.secondary,.done,.danger{border:0;border-radius:12px;font-size:16px;font-weight:650;padding:12px 14px}.tabs button{background:#e5e5ea;white-space:nowrap}.tabs button.active,.primary{background:#007aff;color:white}main{max-width:700px;margin:auto;padding:16px 16px 90px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}.row{display:flex;gap:10px;align-items:center}.row input{flex:1;border:1px solid #ccc;border-radius:12px;padding:13px;font-size:17px}.exercise{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.exercise:last-child{border:0}.name{flex:1;font-size:18px}.done{background:#ffd60a;color:#111}.done.confirmed{background:#34c759;color:white}.danger{background:#ff3b30;color:white;padding:10px 12px}.secondary{background:#e5e5ea}.empty{color:#666;padding:10px 0}.history-item{padding:12px 0;border-bottom:1px solid #eee}.history-item:last-child{border:0}.history-item b{display:block;font-size:17px}.history-item span{color:#666;font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:3}.nav button{flex:1;max-width:330px}.hidden{display:none}</style></head><body>
<header><h1>Exercise Routines</h1><div id='dayTabs' class='tabs'></div></header>
<main><section id='routineView'><div class='card'><h2 id='dayTitle'></h2><div class='row'><input id='exerciseInput' placeholder='Enter an exercise' autocomplete='off'><button id='addBtn' class='primary'>Add</button></div></div><div id='exerciseList' class='card'></div></section><section id='historyView' class='hidden'><div class='card'><div class='row' style='justify-content:space-between'><h2 style='margin:0'>Completed Exercises</h2><button id='clearHistory' class='secondary'>Clear</button></div><div id='historyList'></div></div></section></main>
<div class='nav'><button id='routineBtn' class='primary'>Weekly Routine</button><button id='historyBtn' class='secondary'>History</button></div>
<script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const keyR='exerciseRoutines.v1',keyH='exerciseHistory.v1',keyC='exerciseCompleted.v1';
let routines=JSON.parse(localStorage.getItem(keyR)||'{}'),
    history=JSON.parse(localStorage.getItem(keyH)||'[]'),
    completed=JSON.parse(localStorage.getItem(keyC)||'{}');
days.forEach(d=>routines[d]??=[]);

function mostRecentSundayEvening(){
  const now=new Date(), boundary=new Date(now);
  const daysSinceSunday=now.getDay();
  boundary.setDate(now.getDate()-daysSinceSunday);
  boundary.setHours(19,0,0,0);
  if(now<boundary) boundary.setDate(boundary.getDate()-7);
  return boundary;
}
function resetWeeklyIfNeeded(){
  const boundary=mostRecentSundayEvening().getTime();
  let changed=false;
  Object.keys(completed).forEach(k=>{
    if(Number(completed[k])<boundary){delete completed[k];changed=true}
  });
  if(changed) localStorage.setItem(keyC,JSON.stringify(completed));
}
function completionKey(day,name){return day+'::'+name}
resetWeeklyIfNeeded();
let selected=days[(new Date().getDay()+6)%7];
const save=()=>{localStorage.setItem(keyR,JSON.stringify(routines));localStorage.setItem(keyH,JSON.stringify(history));localStorage.setItem(keyC,JSON.stringify(completed))};
function renderTabs(){dayTabs.innerHTML='';days.forEach(d=>{let b=document.createElement('button');b.textContent=d.slice(0,3);b.className=d===selected?'active':'';b.onclick=()=>{selected=d;showRoutine();render()};dayTabs.appendChild(b)})}
function render(){renderTabs();dayTitle.textContent=selected;exerciseList.innerHTML='';if(!routines[selected].length) exerciseList.innerHTML='<div class="empty">No exercises entered for this day yet.</div>';routines[selected].forEach((x,i)=>{let el=document.createElement('div');el.className='exercise';let n=document.createElement('div');n.className='name';n.textContent=x;let done=document.createElement('button');let ck=completionKey(selected,x);let isDone=!!completed[ck];done.className='done'+(isDone?' confirmed':'');done.textContent=isDone?'✓ Completed':'Completed ?';done.disabled=isDone;done.onclick=()=>complete(x,done);let del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this exercise?')){routines[selected].splice(i,1);save();render()}};el.append(n,done,del);exerciseList.appendChild(el)})}
function add(){let x=exerciseInput.value.trim();if(!x)return;routines[selected].push(x);exerciseInput.value='';save();render()}
function complete(name,button){
  const now=new Date();
  completed[completionKey(selected,name)]=now.getTime();
  history.unshift({name,day:selected,when:now.toISOString()});
  save();
  button.textContent='✓ Completed';
  button.classList.add('confirmed');
  button.disabled=true;
}
function renderHistory(){historyList.innerHTML='';if(!history.length){historyList.innerHTML='<div class="empty">No completed exercises yet.</div>';return}history.forEach(h=>{let d=new Date(h.when);let el=document.createElement('div');el.className='history-item';let b=document.createElement('b');b.textContent='✓ '+h.name;let s=document.createElement('span');s.textContent=h.day+' • '+d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})+' • '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});el.append(b,s);historyList.appendChild(el)})}
function showRoutine(){routineView.classList.remove('hidden');historyView.classList.add('hidden');routineBtn.className='primary';historyBtn.className='secondary'}
addBtn.onclick=add;exerciseInput.onkeydown=e=>{if(e.key==='Enter')add()};routineBtn.onclick=showRoutine;historyBtn.onclick=()=>{routineView.classList.add('hidden');historyView.classList.remove('hidden');routineBtn.className='secondary';historyBtn.className='primary';renderHistory()};clearHistory.onclick=()=>{if(confirm('Clear all completion history?')){history=[];save();renderHistory()}};render();
setInterval(()=>{resetWeeklyIfNeeded();render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resetWeeklyIfNeeded();render()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
